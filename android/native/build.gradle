plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'sc.eidolon.nativeapp'
    compileSdk 35

    defaultConfig {
        applicationId 'sc.eidolon.nativeapp'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '0.1.13'
        // 首次启动直接连这个部署；用户仍然可以在设置里更换服务器。
        buildConfigField "String", "DEFAULT_SERVER_URL", '"https://eidolon.shiny-colors-ai.xyz"'
        // 只打手机需要的 ABI；x86 模拟器用的两份 WebRTC 库会让 APK 多出近 30 MB。
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            storeFile file("${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // 自用侧载：用 debug keystore 给 release 包签名，可直接覆盖安装 debug 包
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    lint {
        abortOnError false
        // AGP 8.7.3 的 lint 和 Kotlin 2.1 分析器不兼容，release 构建跳过 lintVital
        checkReleaseBuilds false
    }
}

kotlin {
    jvmToolchain(17)
}

def apkVersion = android.defaultConfig.versionName

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("Eidolon-SC-${apkVersion}-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.9.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'ai.pipecat:small-webrtc-transport:1.1.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

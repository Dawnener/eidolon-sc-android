plugins {
    id 'com.android.application'
}

android {
    namespace 'sc.eidolon.app'
    compileSdk 35

    defaultConfig {
        applicationId 'sc.eidolon.app'
        // 26 起 WebView 和权限模型都是现在这一套；targetSdk 停在 34，
        // 免得 Android 15 的强制 edge-to-edge 把底部导航压到系统栏下面。
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

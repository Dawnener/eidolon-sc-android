# 把已经发布到部署站点的 APK 同步到 GitHub Releases。
#
# 不在 CI 里重新构建：正式包用本机 ~/.android/debug.keystore 签名，CI 重新构建会换签名，
# 已安装的用户无法覆盖升级。这里直接下载线上那份 APK，保证字节和签名一致。
#
# 用法：先确认
# https://eidolon.shiny-colors-ai.xyz/apk/native/release/Eidolon-SC-0.1.10-release.apk
# 是这次要发布的包（版本号换成标签里的），再推送标签 `app-v0.1.10`。
# 下载地址形如：
# https://github.com/MikiHoshiiP/eidolon-sc-android/releases/download/app-v0.1.10/Eidolon-SC-0.1.10-release.apk
name: Android Release

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 下载线上 APK
        run: |
          version=${TAG#app-v}
          file="Eidolon-SC-${version}-release.apk"
          url="https://eidolon.shiny-colors-ai.xyz/apk/native/release/${file}"
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 -o "$file" "$url"
          size=$(stat -c%s "$file")
          if [ "$size" -lt 1000000 ]; then
            echo "::error::下载到的文件只有 $size 字节，不像 APK"
            exit 1
          fi
          echo "APK_FILE=$file" >> "$GITHUB_ENV"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          sha256sum "$file" | tee SHA256SUMS

      - name: 创建 Release 并上传
        run: |
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Android 客户端 ${APK_VERSION}。

          - 下载 \`${APK_FILE}\` 覆盖安装；已安装旧版本时不需要卸载。
          - 校验：\`$(cat SHA256SUMS)\`

          如果 GitHub 下载慢，可以用本站直连：
          https://eidolon.shiny-colors-ai.xyz/apk/native/release/${APK_FILE}
          EOF
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! output=$(gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Android ${APK_VERSION}" --notes-file "$notes" 2>&1); then
              echo "::error title=Release create failed::$output"
              exit 1
            fi
          fi
          if ! output=$(gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$APK_FILE" SHA256SUMS --clobber 2>&1); then
            echo "::error title=Release upload failed::$output"
            exit 1
          fi
          if ! output=$(gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$notes" 2>&1); then
            echo "::error title=Release edit failed::$output"
            exit 1
          fi

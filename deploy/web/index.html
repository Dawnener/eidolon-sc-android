<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eidolon-SC</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;background:#0b0e14;color:#e7ebf3;font:16px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 22px 72px}
h1{font-size:2rem;line-height:1.25;margin:0 0 14px}h2{font-size:1.15rem;margin:34px 0 10px;color:#f3f5f9}
p{margin:10px 0;color:#c9d0dc}dt{font-weight:600;margin-top:18px;color:#f3f5f9}dd{margin:4px 0 0;color:#c9d0dc}
a{color:#8fc1ff;text-decoration:none}a:hover{text-decoration:underline}
.muted{color:#8f99aa;font-size:.9rem}.card{background:#121722;border:1px solid #242c3a;border-radius:16px;padding:20px;margin:22px 0}
.button{display:inline-block;background:#f3f5f9;color:#0b0e14;font-weight:600;padding:12px 20px;border-radius:12px;margin-top:10px}
.button.secondary{background:transparent;color:#f3f5f9;border:1px solid #3a4558;margin-left:8px}
.links{display:flex;gap:18px;flex-wrap:wrap;margin-top:35px;padding-top:18px;border-top:1px solid #242c3a}
</style></head><body><main>
<h1>Eidolon-SC</h1>
<p>和 283 事务所的偶像说说话</p>
<div class="card">
<h2 style="margin-top:0">在手机上使用</h2>
<p>安装 Android App，用 GitHub 登录后就可以挑一位偶像，和她聊天、打电话。</p>
<a class="button" id="github-download" href="https://github.com/MikiHoshiiP/eidolon-sc-android/releases/latest">从 GitHub 下载</a>
<a class="button secondary" href="/api/download/android">本站下载</a>
</div>
<p class="muted">非官方粉丝作品，角色由 AI 扮演。</p>
<nav class="links"><a href="/">首页</a><a href="/privacy">隐私政策</a><a href="/terms">使用条款</a></nav>
<script>
(() => {
  const button = document.getElementById('github-download');
  button.addEventListener('click', async (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
    event.preventDefault();
    try {
      const response = await fetch(
        'https://api.github.com/repos/MikiHoshiiP/eidolon-sc-android/releases/latest',
        { cache: 'no-store' },
      );
      if (!response.ok) throw new Error('GitHub API unavailable');
      const release = await response.json();
      const asset = (release.assets || []).find((item) => item.name.endsWith('-release.apk'));
      window.location.assign(asset ? asset.browser_download_url : release.html_url);
    } catch {
      window.location.assign(button.href);
    }
  });
})();
</script></main></body></html>

<h1>Eidolon-SC</h1>
<p>和 283 事务所的偶像说说话</p>
<div class="card">
<h2 style="margin-top:0">在手机上使用</h2>
<p>安装 Android App，用 GitHub 登录后就可以挑一位偶像，和她聊天、打电话。</p>
<a class="button" id="github-download" href="https://github.com/MikiHoshiiP/eidolon-sc-android/releases/latest">从 GitHub 下载</a>
<a class="button secondary" href="/api/download/android">本站下载</a>
</div>
<p class="muted">非官方粉丝作品，角色由 AI 扮演。</p>
<nav class="links"><a href="/">首页</a><a href="/privacy">隐私政策</a><a href="/terms">使用条款</a></nav>
<script>
(() => {
  const button = document.getElementById('github-download');
  button.addEventListener('click', async (event) => {
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.button !== 0) return;
    event.preventDefault();
    try {
      const response = await fetch(
        'https://api.github.com/repos/MikiHoshiiP/eidolon-sc-android/releases/latest',
        { cache: 'no-store' },
      );
      if (!response.ok) throw new Error('GitHub API unavailable');
      const release = await response.json();
      const asset = (release.assets || []).find((item) => item.name.endsWith('-release.apk'));
      window.location.assign(asset ? asset.browser_download_url : release.html_url);
    } catch {
      window.location.assign(button.href);
    }
  });
})();
</script></main></body></html>
